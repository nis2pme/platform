# NIS2PME — Nginx config para container Docker (on-prem)
#
# NOTA: Em nginx, add_header num bloco location filho cancela todos os
# add_header do bloco pai. Por isso os headers de segurança são
# repetidos em cada location que define os seus próprios add_header.
# Referência: https://nginx.org/en/docs/http/ngx_http_headers_module.html

# A versão exata do nginx no cabeçalho `Server` só serve a quem procura alvos
# para uma vulnerabilidade conhecida dessa versão.
#
# FICA FORA do bloco delimitado abaixo, e tem de continuar assim: o entrypoint
# apaga tudo entre os marcadores quando não se confia no Cloudflare, e uma
# diretiva de segurança lá dentro desaparecia justamente nas instalações sem
# proxy à frente — as mais expostas.
server_tokens off;

# __CF_REALIP_BEGIN__
# Auditoria de IP — só quando há um Cloudflare Tunnel/proxy de confiança à frente. O entrypoint
# remove este bloco delimitado quando TRUST_CLOUDFLARE_HEADERS!=true, senão o cf= ficaria sempre
# vazio e o access_log referenciaria um log_format inexistente.
# $realip_remote_addr = peer TCP real; $remote_addr = após real_ip (= CF-Connecting-IP). (log_format
# tem de viver em contexto http; este ficheiro é incluído dentro do http{} do nginx stock.)

log_format cf_audit '$realip_remote_addr -> $remote_addr cf=$http_cf_connecting_ip '
                    '"$request" $status xff="$http_x_forwarded_for" ua="$http_user_agent"';
# __CF_REALIP_END__

server {
    listen 80;
    server_name _;

    # Ficheiros estáticos do frontend compilado (copiados na imagem Docker)
    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # __CF_REALIP_BEGIN__
    # Confiar no CF-Connecting-IP como IP do cliente. SÓ válido atrás de um Cloudflare Tunnel/proxy
    # de confiança que injeta o header e fecha a origem à internet; o entrypoint remove este bloco
    # quando TRUST_CLOUDFLARE_HEADERS!=true. Sem isso, um cliente local forjava o header e o nginx
    # envenenava o X-Real-IP que o backend consome (CWE-348). A decisão de confiar é do backend
    # (mesma flag); aqui só se APLICA no ponto onde o IP do peer ainda é fidedigno.
    # ${REAL_IP_FROM} é substituído pelo entrypoint pelo gateway exato da bridge (ex. 172.21.0.1);
    # default largo (toda a gama de bridges) se não vier do ambiente.
    set_real_ip_from ${REAL_IP_FROM};
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive on;
    access_log /var/log/nginx/access.log cf_audit;
    # __CF_REALIP_END__

    # Os security headers NÃO vivem aqui, ao nível do server — vivem em cada
    # location que serve a SPA.
    #
    # A razão é a herança do nginx: uma location sem add_header próprio herda os
    # do server. As locations de /api/ não declaram nenhum (de propósito, porque
    # quem manda nas respostas da API é o middleware do FastAPI) — e por isso
    # herdavam estes, que chegavam ao cliente A JUNTAR aos do backend. O browser
    # recebia dois X-Frame-Options ("SAMEORIGIN" e "DENY") e duas CSP em
    # contradição; perante cabeçalhos duplicados e divergentes o comportamento
    # dos browsers não é uniforme, e há motores que simplesmente ignoram o
    # cabeçalho — a proteção desaparecia exatamente onde se julgava existir.
    #
    # Declarar os cabeçalhos onde se aplicam custa repeti-los; herdá-los custa
    # aplicá-los onde não deviam. A repetição é o mal menor, e é visível.

    # Proxy para o backend FastAPI (nome do serviço Docker)
    location /api/ {
        # Re-resolver o upstream em runtime (DNS embebido do Docker) — senão o
        # nginx cacheia o IP no arranque e parte se o backend mudar de IP.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $nis2pme_backend backend;
        proxy_pass         http://$nis2pme_backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Repõe o esquema real nas redireções geradas pela aplicação: ela vê uma
        # ligação em claro (o TLS termina aqui) e escreveria `http://`, fazendo
        # o cliente descer a ligação a texto simples ao segui-la.
        proxy_redirect http:// $scheme://;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        # Tamanho máximo de body para uploads de evidências
        client_max_body_size 15M;
        # Não adicionar headers CSP aqui — o FastAPI middleware já os define
    }

    # Backups: importação de ficheiros .nbk grandes e operações demoradas
    # (inspecionar/restaurar decifram e aplicam dumps completos) — limites
    # próprios, mais largos do que o /api/ geral.
    # Sem barra final, como a do dossiê: apanha /api/backups E /api/backups/... .
    # Com barra final, um pedido a /api/backups entrava num ciclo de redireções —
    # o nginx acrescentava a barra, a aplicação (que regista a rota sem ela)
    # tirava-a outra vez, e o cliente saltava entre as duas para sempre.
    location /api/backups {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $nis2pme_backend_bkp backend;
        proxy_pass         http://$nis2pme_backend_bkp:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Repõe o esquema real nas redireções geradas pela aplicação: ela vê uma
        # ligação em claro (o TLS termina aqui) e escreveria `http://`, fazendo
        # o cliente descer a ligação a texto simples ao segui-la.
        proxy_redirect http:// $scheme://;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1800s;
        client_max_body_size 4g;
        # Encaminhar o upload à medida que chega (não bufferizar GB no nginx)
        proxy_request_buffering off;
    }

    # Dossiê de auditoria: gerar+descarregar um .nis2pme com evidências pode
    # demorar bem mais do que os timeouts do /api/ geral. Sem barra final:
    # apanha /api/dossie E /api/dossie/... .
    location /api/dossie {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $nis2pme_backend_dsr backend;
        proxy_pass         http://$nis2pme_backend_dsr:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Repõe o esquema real nas redireções geradas pela aplicação: ela vê uma
        # ligação em claro (o TLS termina aqui) e escreveria `http://`, fazendo
        # o cliente descer a ligação a texto simples ao segui-la.
        proxy_redirect http:// $scheme://;
        proxy_read_timeout 1800s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1800s;
        client_max_body_size 256m;
        proxy_buffering off;
        # O parecer (até 256 MiB) passa à medida que chega, como os backups: com o
        # buffering, o nginx guardava-o inteiro no disco dele antes de o backend
        # poder recusar um pedido sem sessão.
        proxy_request_buffering off;
    }

    # SPA fallback — qualquer rota desconhecida serve o index.html (Vue Router)
    location / {
        try_files $uri $uri/ /index.html;

        # Security headers da SPA. CSP para o Vue.js:
        #   - script-src 'self': sem inline scripts (PrimeVue não precisa)
        #   - style-src 'unsafe-inline': necessário para PrimeVue (estilos dinâmicos)
        #   - img-src data: e blob:: avatares inline e pré-visualização de evidências
        #   - connect-src 'self': chamadas AJAX apenas à origem própria
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # O index.html vai sempre com no-cache: é o único ficheiro sem hash no nome e
    # é ele que diz que ficheiros carregar. Um antigo em cache apontaria para os de
    # uma versão anterior, que a atualização já tirou. O try_files e o index acima
    # acabam aqui por dentro. Define um add_header, logo repete os de segurança.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    # Bloquear acesso a ficheiros ocultos (ex: .env, .git)
    # Vem ANTES da location dos assets: entre locations regex ganha a primeira
    # que casa, e assim um caminho oculto nunca escapa pela extensão do ficheiro.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Cache longo para assets estáticos com hash no nome (Vite): o nome muda
    # sempre que o conteúdo muda, logo o ficheiro pode ficar em cache para sempre.
    # O try_files =404 impede que um ficheiro inexistente caia no fallback da SPA
    # e devolva o index.html com estado 200 — o browser tentaria interpretar HTML
    # como JavaScript e falharia de forma opaca.
    # NOTA: add_header neste bloco repete os headers do pai (obrigatório por design do nginx)
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Repetição obrigatória dos security headers (nginx cancela add_header do pai)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
}
